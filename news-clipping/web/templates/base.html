<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스클리핑 — 카테노이드 PR</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">

  <!-- 사이드바 -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">N</div>
      <div>
        <div class="logo-title">뉴스클리핑</div>
        <div class="logo-sub">카테노이드 PR</div>
      </div>
    </div>
    <ul class="nav-menu">
      <li><a href="/company"   class="nav-item {% if page=='company'   %}active{% endif %}">
        <span class="nav-icon">🏢</span> 기업정보</a></li>
      <li><a href="/category"  class="nav-item {% if page=='category'  %}active{% endif %}">
        <span class="nav-icon">📂</span> 카테고리</a></li>
      <li><a href="/settings"  class="nav-item {% if page=='settings'  %}active{% endif %}">
        <span class="nav-icon">⚙️</span> 운영 설정</a></li>
      <li><a href="/developer" class="nav-item {% if page=='developer' %}active{% endif %}">
        <span class="nav-icon">🔧</span> 개발자 설정</a></li>
      <li><a href="/test"      class="nav-item {% if page=='test'      %}active{% endif %}">
        <span class="nav-icon">🧪</span> 테스트</a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn btn-primary btn-run" onclick="runMonitoring()">
        ▶ 모니터링 실행
      </button>
    </div>
  </nav>

  <!-- 메인 영역 -->
  <main class="main">
    <div class="topbar">
      <h1 class="page-title">{% block title %}{% endblock %}</h1>
      <div class="topbar-actions">
        <span id="save-feedback" class="save-feedback"></span>
        <button class="btn btn-save" onclick="saveAll()">전체 저장</button>
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>

<!-- 실행 상태 모달 -->
<div class="modal-overlay" id="run-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">모니터링 실행 중</div>
    <div class="modal-body">
      <div class="spinner"></div>
      <p id="run-progress">시작 중...</p>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
